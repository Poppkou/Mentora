<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentora — практикум по ИИ: промпты, декомпозиция, агенты</title>
<meta name="description" content="Mentora: практикум для тех, кто уже пользуется ИИ. Инжиниринг промптов, декомпозиция задач, артефакты, код, анализ данных, агенты и проверка ответов.">
<meta name="theme-color" content="#FBFAF7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-10 -6 140 112'%3E%3Cpath fill='%237B6FBE' fill-rule='evenodd' d='M0 100V44a30 30 0 0 1 60 0v56zM19 100V46a11 11 0 0 1 22 0v54z'/%3E%3Cpath fill='%2388A68F' fill-rule='evenodd' d='M60 100V44a30 30 0 0 1 60 0v56zM79 100V46a11 11 0 0 1 22 0v54z'/%3E%3Cpath fill='%237B6FBE' d='M60 0c1.6 6.6 4.4 9.4 11 11-6.6 1.6-9.4 4.4-11 11-1.6-6.6-4.4-9.4-11-11 6.6-1.6 9.4-4.4 11-11z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Comfortaa:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --ink:#2B2842; --soft:#66627C; --line:#E8E5EF;
  --accent:#7B6FBE; --accentD:#5E529F; --accentSoft:#EFEDF8;
  --sage:#88A68F; --sageD:#55775E; --sageSoft:#E9F1EB; --peach:#A79CD9; --peachSoft:#F3F1FA; --sand:#EEF3EF;
  --ok:#4C8262; --okSoft:#E6F1E9; --bad:#B4616A; --badSoft:#F8E9EB;
  --shadow:0 1px 2px rgba(43,40,66,.04), 0 8px 24px rgba(43,40,66,.06);
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 12px}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}

/* шапка */
header.top{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;font-family:Comfortaa,Manrope,sans-serif;font-weight:700;font-size:22px;color:var(--accent);letter-spacing:-.01em}
.logo .mk{height:30px;width:36px;flex:none}
.spacer{flex:1}
.mini{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);font-weight:600}
.mini .track{width:90px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.mini{white-space:nowrap}
.mini .track i{display:block;height:100%;background:var(--sage);border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:16px;background:var(--accent);color:#fff;transition:transform .15s ease, box-shadow .2s ease, background .2s;box-shadow:0 2px 0 rgba(0,0,0,.04)}
.btn:hover{background:var(--accentD);transform:translateY(-1px);box-shadow:0 6px 18px rgba(123,111,190,.28)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.soft{background:var(--accentSoft);color:var(--accentD)}
.btn.soft:hover{background:#E4E0F4;box-shadow:none}
.btn.plain{background:transparent;color:var(--soft);padding:10px 12px;box-shadow:none}
.btn.plain:hover{color:var(--ink);background:rgba(0,0,0,.03);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}

/* анимации */
.view{animation:viewIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal.on{opacity:1;transform:none}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

/* главная */
.hello{padding:48px 0 12px}
.hello .eyebrow{color:var(--soft);font-weight:600;margin-bottom:6px}
.hello h1{font-size:clamp(28px,5vw,42px);max-width:640px}
.hello p.sub{color:var(--soft);font-size:18px;max-width:600px;margin-top:12px}
.continue{margin:28px 0 8px;background:var(--surface);border-radius:24px;padding:24px;box-shadow:var(--shadow);display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--sage);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.continue .ct{flex:1;min-width:220px}
.continue .ct small{color:var(--soft);font-weight:600}
.continue .ct h3{font-size:21px;margin:2px 0 4px}
.continue .ct p{color:var(--soft);margin:0}
.sec-title{font-size:20px;margin:40px 0 16px}
.lessons{position:relative;display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.lesson{display:flex;gap:16px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid transparent;border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);transition:transform .2s ease, border-color .2s, box-shadow .2s}
.lesson:hover{transform:translateY(-2px);border-color:#D6D0EE;box-shadow:0 10px 30px rgba(42,39,64,.08)}
.lesson .ln{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;background:var(--c);color:var(--ink);position:relative}
.lesson.done .ln{background:var(--okSoft);color:var(--ok)}
.lesson.current .ln::after{content:"";position:absolute;inset:-5px;border-radius:17px;border:2px solid var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
.lesson .lt{flex:1;min-width:0}
.lesson .lt b{display:block;font-size:17px;line-height:1.3}
.lesson .lt span{font-size:14px;color:var(--soft)}
.lesson .lm{font-size:13px;color:var(--soft);white-space:nowrap}
.lesson.locked{background:#F7F6FA;box-shadow:none;border-color:var(--line)}
.lesson.locked .lt b,.lesson.locked .lt span{color:var(--soft)}
.lesson.locked .ln{background:var(--line);font-size:16px}
.lockcard{margin-top:18px;background:var(--surface);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.lockcard .lk{font-size:40px;line-height:1;margin-bottom:10px}
.hbtn .ico{display:none}.hbtn.on{background:var(--sageSoft);border-color:var(--sage);color:var(--sageD)}.hbtn .star{color:var(--sageD)}
@media (max-width:520px){.mini .cnt{display:none}.hbtn .lbl{display:none}.hbtn .ico{display:inline}.hbtn{min-width:40px;justify-content:center}}
.qa-badge{display:inline-grid;place-items:center;height:24px;padding:0 8px;border-radius:8px;background:#2B2842;color:#fff;font-weight:800;font-size:12px;letter-spacing:.05em;border:0}
.promo{margin-top:10px}
.promo-row{display:flex;gap:8px;flex-wrap:wrap}
.promo-row input{flex:1;min-width:200px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;text-transform:uppercase}
.promo-msg{min-height:22px;margin-top:8px;font-size:15px;font-weight:600}
.promo-msg.ok{color:var(--ok)}.promo-msg.no{color:var(--bad)}
.acc-status .pill{margin-bottom:8px}.acc-status p{margin:6px 0 0}
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.acc-grid ul{margin:8px 0 0;padding-left:20px;font-size:15px}.acc-grid h3,.panel h3{font-size:18px}
@media (max-width:640px){.acc-grid{grid-template-columns:1fr}}
.qa-panel{margin-top:22px;border:2px dashed #B9B2DA;border-radius:24px;padding:22px;background:#FDFCFF}
.qa-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.qa-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.qa-dump{font-size:13px;background:var(--bg);border-radius:12px;padding:12px;overflow:auto;max-height:320px}
/* урок */
.lessonpage{padding-top:22px;padding-bottom:80px}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.lhead .tag{font-size:14px;font-weight:700;color:var(--soft)}
.steps{display:flex;gap:6px;margin:0 0 26px}
.steps .s{flex:1;display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700;color:var(--soft);background:none;border:0;padding:0;text-align:left}
.steps .s i{display:block;height:5px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.steps .s i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.steps .s.past i::after,.steps .s.cur i::after{transform:scaleX(1)}
.steps .s.past i::after{background:var(--sage)}
.steps .s.cur{color:var(--ink)}
.steps .s[disabled]{cursor:default}
.stage{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
.lessonpage h2{font-size:clamp(25px,4vw,34px);margin-bottom:14px}
.story{font-size:19px;line-height:1.7;max-width:700px}
.story p{margin:0 0 16px}
.quote{background:var(--surface);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);border-left:4px solid var(--peach);font-size:17px}
.navrow{display:flex;gap:10px;align-items:center;margin-top:28px;flex-wrap:wrap}
.navrow .spacer{flex:1}
.cards{display:grid;gap:14px}
.tcard{background:var(--surface);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow);display:flex;gap:18px;align-items:flex-start}
.tcard .ti{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px;background:var(--c,var(--accentSoft))}
.tcard h3{font-size:18px;margin-bottom:6px}
.tcard p{color:#454160;margin:0}
.panel{background:var(--surface);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.task-intro{background:var(--sand);border-radius:16px;padding:14px 18px;margin-bottom:18px;font-weight:600}
.hint{font-size:15px;color:var(--soft)}

/* квиз */
.q{margin-bottom:26px}
.q .qt{font-weight:700;margin-bottom:10px;font-size:17px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:13px 16px;margin-bottom:8px;transition:background .2s,border-color .2s,transform .15s;line-height:1.45}
.opt:hover{background:var(--accentSoft)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt.locked{pointer-events:none}
.expl{font-size:15px;line-height:1.55;border-radius:12px;padding:11px 14px;margin-top:6px;animation:viewIn .35s ease}
.expl.ok{background:var(--okSoft);color:#2F5A42}
.expl.no{background:var(--badSoft);color:#7C3640}

/* упорядочить */
.pool,.seq{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 14px;transition:all .2s}
.chip:hover{background:var(--accentSoft)}
.chip .cn{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.seq .chip{background:var(--accentSoft)}
.seq .chip .cn{background:var(--accent);color:#fff;border:0}
.seq .chip.right{background:var(--okSoft)}.seq .chip.right .cn{background:var(--ok)}
.seq .chip.wrong{background:var(--badSoft)}.seq .chip.wrong .cn{background:var(--bad)}
.colhead{font-weight:700;font-size:14px;color:var(--soft);margin:16px 0 8px}

/* сортировка / сопоставление */
.sortitem{background:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:background .3s}
.sortitem .st{font-weight:600;margin-bottom:10px}
.sortitem .bs{display:flex;gap:8px;flex-wrap:wrap}
.sortitem .bs button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;transition:all .2s}
.sortitem .bs button:hover{border-color:var(--accent);color:var(--accentD)}
.sortitem.okk{background:var(--okSoft)}.sortitem.okk .bs button.chosen{border-color:var(--ok);color:var(--ok)}
.sortitem.nok .bs button.chosen{border-color:var(--bad);color:var(--bad)}

/* журнал */
.log{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px 14px;border:2px solid transparent;text-align:left;width:100%;animation:stepIn .45s cubic-bezier(.2,.8,.2,1);transition:border-color .2s, background .2s}
@keyframes stepIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.step .ic{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:15px}
.step .sa{font-weight:700;line-height:1.35}
.step .sw{font-size:14px;color:var(--soft);line-height:1.45}
.step.think .ic{background:var(--accentSoft)}
.step.tool .ic{background:var(--sageSoft)}
.step.done .ic{background:var(--sand)}
.step.warn .ic{background:var(--peachSoft)}
.step.pick{cursor:pointer}
.step.pick:hover{border-color:#CFC8EC}
.step.right{border-color:var(--ok);background:var(--okSoft)}
.step.wrong{border-color:var(--bad);background:var(--badSoft)}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--soft);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* найди ошибку */
.doc{background:var(--bg);border-radius:16px;padding:18px 20px;line-height:2}
.sent{cursor:pointer;border-radius:6px;padding:2px 3px;transition:background .2s, box-shadow .2s}
.sent:hover{background:var(--accentSoft)}
.sent.sel{background:var(--accentSoft);box-shadow:inset 0 -2px 0 var(--accent)}
.sent.right{background:var(--okSoft);box-shadow:inset 0 -2px 0 var(--ok)}
.sent.wrong{background:var(--badSoft)}
.sent.missed{box-shadow:inset 0 -2px 0 var(--bad)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mopt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 14px;transition:background .2s,border-color .2s}
.mopt:hover{background:var(--accentSoft)}
.mopt .box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid #B4ABDD;background:var(--surface);margin-top:2px;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff}
.mopt.on .box{background:var(--accent);border-color:var(--accent)}.mopt.on .box::after{content:"✓"}
.mopt.right{border-color:var(--ok);background:var(--okSoft)}.mopt.right .box{background:var(--ok);border-color:var(--ok)}
.mopt.wrong{border-color:var(--bad);background:var(--badSoft)}.mopt.wrong .box{background:var(--bad);border-color:var(--bad)}
.mopt.missed{border-color:var(--bad);border-style:dashed}

/* формы */
label.f{display:block;font-weight:700;margin:16px 0 6px}
label.f small{font-weight:500;color:var(--soft)}
textarea,input[type=text]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;background:var(--surface);color:var(--ink);resize:vertical;transition:border-color .2s, box-shadow .2s}
textarea:focus,input:focus{outline:none;border-color:#B4ABDD;box-shadow:0 0 0 4px var(--accentSoft)}
.chk{display:flex;gap:12px;align-items:flex-start;margin:8px 0;font-weight:600;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.chk span small{display:block;font-weight:500;color:var(--soft)}
.out{background:var(--bg);border-radius:16px;padding:16px 18px;margin-top:12px;overflow:auto;font-size:16px}
.out table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0;background:var(--surface);border-radius:10px;overflow:hidden}
.out td,.out th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.out th{background:#F6F5FA}
.out h4{font-size:16px;margin:14px 0 6px}
.out ul{padding-left:20px;margin:6px 0}
.out p{margin:6px 0}
details.more{margin-top:14px;background:var(--bg);border-radius:14px;padding:4px 16px}
details.more summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--accentD)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okSoft);color:var(--ok)}.pill.no{background:var(--badSoft);color:var(--bad)}.pill.mid{background:var(--accentSoft);color:var(--accentD)}
.score{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.score:last-child{border:0}
.block-title{font-size:17px;margin:26px 0 10px}

/* успех */
.success{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--okSoft);border-radius:18px;padding:16px 18px;margin-top:18px}
.success svg{flex:none}
.success .ck{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.success .st{flex:1;min-width:180px;font-weight:700;color:#2F5A42}
.success .st small{display:block;font-weight:500}
.tryagain{background:var(--badSoft);color:#7C3640;border-radius:16px;padding:13px 16px;margin-top:14px;font-weight:600}
.takeaway{background:var(--surface);border-radius:24px;padding:28px;box-shadow:var(--shadow);text-align:center}
.takeaway .big{font-size:52px;line-height:1;margin-bottom:12px;display:inline-block;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.takeaway h2{margin-bottom:10px}
.takeaway .tk{font-size:19px;max-width:560px;margin:0 auto 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:40;animation:toast 2.4s ease forwards;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:35}
.spin{display:inline-block;width:15px;height:15px;border:2.5px solid var(--accentSoft);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
footer{padding:20px 0 40px;color:var(--soft);font-size:14px}
footer b{font-family:Comfortaa,Manrope,sans-serif;color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
body.big{zoom:1.15}
.hbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--accentD);transition:border-color .2s,background .2s}
.hbtn:hover{border-color:var(--accent);background:var(--accentSoft)}
.hbtn[aria-pressed=true]{background:var(--accentSoft);border-color:var(--accent)}
@media (max-width:520px){.logo{font-size:19px}.logo .mk{height:26px;width:31px}.mini .track{display:none}header.top .wrap{gap:8px}.hbtn{padding:6px 10px}}
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:44px 0 8px}
.hero .eyebrow{color:var(--sageD);font-weight:700;margin-bottom:8px}
.hero h1{font-size:clamp(28px,5vw,42px)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.sub{color:var(--soft);font-size:18px;max-width:560px;margin:12px 0 0}
.hero .art{width:150px;height:auto}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding-top:28px}.hero .art{display:none}}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.facts span{background:var(--sageSoft);color:var(--sageD);font-weight:700;font-size:14px;border-radius:99px;padding:6px 14px}
.welcome{margin-top:24px;background:var(--accentSoft);border-radius:24px;padding:24px}
.welcome h2{font-size:21px;margin-bottom:6px}
.welcome>p{color:var(--soft);margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px;padding:0;list-style:none}
.how li{background:var(--surface);border-radius:16px;padding:14px;font-size:15px;line-height:1.45}
.how li b{display:block;font-size:16px;margin:6px 0 2px}
.how .num{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:15px}
@media (max-width:760px){.how{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.how{grid-template-columns:1fr}}
.part{margin:38px 0 14px}
.part .tagp{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:4px 12px;background:var(--c);color:var(--ink)}
.part h2{font-size:22px;margin:10px 0 4px}
.part p{color:var(--soft);margin:0}
.part .pill{vertical-align:middle;margin-left:4px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:34px 0 10px}
.quick button{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:border-color .2s,transform .2s}
.quick button:hover{border-color:var(--accent);transform:translateY(-2px)}
.quick .qi{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:21px;background:var(--c)}
.quick b{display:block}.quick span span{font-size:14px;color:var(--soft)}
@media (max-width:600px){.quick{grid-template-columns:1fr}}
.page{padding-top:22px;padding-bottom:60px}
.page h1{font-size:clamp(26px,4.5vw,36px);margin:6px 0 10px}
.page .lead{font-size:18px;color:var(--soft);max-width:640px;margin-bottom:22px}
.faq{display:grid;gap:12px}
.faq .tcard{align-items:flex-start}
.gl{display:grid;gap:10px}
.gl div{background:var(--surface);border-radius:16px;padding:16px 20px;box-shadow:var(--shadow)}
.gl dt{font-weight:800;font-size:18px;color:var(--accentD)}
.gl dd{margin:4px 0 0}
.gl dd small{display:block;color:var(--soft);margin-top:4px;font-size:15px}
.wordlink{background:none;border:0;padding:0;color:var(--accentD);font-weight:700;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="logo" data-go="home" aria-label="Mentora — на главную"><svg class="mk" viewBox="0 0 120 100" aria-hidden="true"><path fill="#7B6FBE" fill-rule="evenodd" d="M0 100V44a30 30 0 0 1 60 0v56zM19 100V46a11 11 0 0 1 22 0v54z"/><path fill="#88A68F" fill-rule="evenodd" d="M60 100V44a30 30 0 0 1 60 0v56zM79 100V46a11 11 0 0 1 22 0v54z"/><path fill="#7B6FBE" d="M60 0c1.6 6.6 4.4 9.4 11 11-6.6 1.6-9.4 4.4-11 11-1.6-6.6-4.4-9.4-11-11 6.6-1.6 9.4-4.4 11-11z"/></svg>Mentora</button>
  <span class="spacer"></span>
  <span class="mini" id="mini"></span>

  <button class="hbtn" id="accBtn" data-go="access">Доступ</button>

<footer><div class="wrap"><b>Mentora</b> · практикум по работе с ИИ. Все данные в заданиях придуманы. Не вводите на сайте настоящие персональные данные.</div></footer>
<canvas id="confetti"></canvas>

<script>
// =============== КУРС ===============
// Модуль 0 — короткий онбординг в платформу. Модули 1–4 — продвинутая программа.
// free: true — модуль открыт без подписки.
const MODULES=[
  {n:0, tag:'Модуль 0', title:'Введение', desc:'Два коротких урока о том, как устроена платформа и чему вы научитесь.', free:true, c:'var(--sageSoft)'},
  {n:1, tag:'Модуль 1', title:'Инжиниринг промптов', desc:'Фреймворк сильного промпта, роли, контекст, примеры и цепочка рассуждений.', free:true, c:'var(--accentSoft)'},
  {n:2, tag:'Модуль 2', title:'Декомпозиция задач', desc:'Как разбить сложную рабочую задачу на подзадачи и делегировать их ИИ.', free:false, c:'var(--sageSoft)'},
  {n:3, tag:'Модуль 3', title:'Продвинутые техники', desc:'Артефакты, генерация кода, анализ больших данных, свои ассистенты и агенты.', free:false, c:'var(--accentSoft)'},
  {n:4, tag:'Модуль 4', title:'Ошибки и ограничения', desc:'Галлюцинации, проверка логики модели, конфиденциальность.', free:false, c:'var(--sageSoft)'},
];
const LESSONS = [
// ---- Модуль 0. Введение
{ id:'i1', mod:0, title:'Как устроена Mentora', short:'Модули, уровни и шаги урока', min:4,
  intro:`<p>Mentora — практикум для тех, кто уже пользуется ИИ, но чувствует, что получает от него меньше, чем мог бы. Ответы выходят общими, сложные задачи приходится делать вручную, а результату не всегда можно доверять.</p>
  <p>Курс состоит из пяти модулей. Этот вводный модуль займёт пять минут: вы узнаете, как устроены уроки и как здесь сохраняется прогресс.</p>`,
  cards:[
    {i:'🧭', h:'Модули и уровни', t:'Уроки сгруппированы в модули. Пройдите все уроки модуля, и ваш уровень вырастет на единицу. Сейчас у вас уровень 0, максимум — 5.'},
    {i:'🪜', h:'Четыре шага урока', t:'Знакомство с задачей, короткая теория, практика и итог. Полоска шагов вверху урока показывает, где вы находитесь.'},
    {i:'🔓', h:'Уроки по порядку', t:'Следующий урок открывается, когда вы выполните практику текущего. Пройденные уроки всегда можно открыть снова.'},
    {i:'💾', h:'Прогресс в браузере', t:'Регистрация не нужна. Пройденные уроки и доступ запоминаются в этом браузере на этом устройстве.'},
  ],
  practice:{type:'quiz', intro:'Проверим, что вы освоились. Ошибки ни на что не влияют: можно выбирать снова.', qs:[
    {q:'Что нужно сделать, чтобы открыть следующий урок?', o:['Подождать сутки','Выполнить практику текущего урока','Пролистать урок до конца'], a:1, e:'Урок засчитывается после практики, и сразу открывается следующий.'},
    {q:'Как повысить уровень?', o:['Пройти все уроки модуля','Пройти любой один урок'], a:0, e:'Уровень растёт, когда пройден весь модуль.'},
    {q:'Где хранится ваш прогресс?', o:['В аккаунте на сервере','В этом браузере на этом устройстве'], a:1, e:'Прогресс сохраняется в браузере. На другом устройстве курс начнётся заново.'},
  ]},
  takeaway:'Пять модулей, уроки по порядку, практика в каждом уроке. Уровень растёт за каждый пройденный модуль.'},

{ id:'i2', mod:0, title:'Карта курса: от промпта к агенту', short:'Какой модуль решает какую проблему', min:5,
  intro:`<p>Курс построен вокруг типичных проблем опытных пользователей ИИ. Модуль 1 учит писать промпты, после которых не приходится переспрашивать. Модуль 2 — раскладывать большую задачу на шаги, которые ИИ выполнит надёжно.</p>
  <p>Модуль 3 переходит к продвинутым техникам: готовые документы и таблицы, код, анализ данных, собственные ассистенты. Модуль 4 учит не доверять модели вслепую.</p>
  <p>Совет на весь курс: держите в голове одну свою реальную рабочую задачу и примеряйте к ней каждый урок.</p>`,
  cards:[
    {i:'✍️', h:'Модуль 1. Промпты', t:'Роль, контекст, ограничения, формат, примеры и рассуждение по шагам.'},
    {i:'🧩', h:'Модуль 2. Декомпозиция', t:'От бизнес-цели к цепочке подзадач и контрольным точкам.'},
    {i:'🛠️', h:'Модуль 3. Техники', t:'Артефакты, генерация кода, анализ данных, свои GPT и агенты.'},
    {i:'🔍', h:'Модуль 4. Ограничения', t:'Галлюцинации, проверка логики и конфиденциальность.'},
  ],
  practice:{type:'sort', intro:'Для каждой проблемы выберите модуль, который её решает.', opts:['Промпты','Декомпозиция','Техники','Ограничения'], items:[
    {t:'Ответы модели слишком общие, приходится много раз переспрашивать', k:0, e:'Обычно не хватает контекста и формата. Это модуль 1.'},
    {t:'Нужно поручить ИИ запуск рассылки целиком, а он путается', k:1, e:'Большую задачу сначала раскладывают на шаги. Это модуль 2.'},
    {t:'Нужно разобрать выгрузку продаж на 20 000 строк', k:2, e:'Анализ больших данных — продвинутая техника из модуля 3.'},
    {t:'Модель уверенно привела цифру, которой нет в источнике', k:3, e:'Это галлюцинация. Как с ними работать, разбираем в модуле 4.'},
    {t:'Хочется своего ассистента, который отвечает по внутренним регламентам', k:2, e:'Свои GPT и агенты — тема модуля 3.'},
    {t:'В сложном расчёте модель перескакивает к выводу', k:0, e:'Здесь поможет цепочка рассуждений из модуля 1.'},
  ]},
  takeaway:'Промпты → декомпозиция → техники → проверка. Примеряйте каждый урок к своей реальной задаче.'},

// ---- Модуль 1. Инжиниринг промптов
{ id:'p1', mod:1, title:'Анатомия сильного промпта', short:'Фреймворк из шести блоков', min:10,
  intro:`<p>Модель не знает ни вашей компании, ни аудитории, ни того, что вы уже пробовали. Всё, чего нет в промпте, она додумывает, и обычно выбирает самый средний вариант. Отсюда общие ответы.</p>
  <p>Сильный промпт закрывает эти пробелы заранее. Удобно держать в голове шесть блоков: роль, контекст, задача, ограничения, формат и примеры. Не каждый промпт требует всех шести, но проверять себя по списку полезно всегда.</p>`,
  cards:[
    {i:'🎭', h:'Роль и контекст', t:'Кем выступает модель и что ей нужно знать: продукт, аудитория, цель, что уже сделано.'},
    {i:'🎯', h:'Задача', t:'Одно конкретное действие с объёмом: «напиши 3 варианта заголовка до 60 символов», а не «помоги с заголовком».'},
    {i:'🚧', h:'Ограничения', t:'Чего избегать, что обязательно учесть, какие источники использовать, когда сказать «не знаю».'},
    {i:'📋', h:'Формат и примеры', t:'Как должен выглядеть результат: таблица, список, JSON, длина. Пример нужного ответа работает лучше любого описания.'},
  ],
  practice:{type:'multi', intro:'Коллега написал промпт и недоволен результатом. Каких блоков в нём не хватает? Отметьте все.',
    doc:'Ты опытный маркетолог. Напиши пост про наш новый онлайн-курс.',
    opts:[
      {t:'Роль', ok:false, e:'Роль есть: «опытный маркетолог».'},
      {t:'Контекст: что за курс, для кого, чем он отличается', ok:true, e:'Без этого модель придумает общий курс для всех.'},
      {t:'Конкретная задача с объёмом и площадкой', ok:true, e:'Пост для какой соцсети и какой длины? Модель будет угадывать.'},
      {t:'Ограничения: тон, запрещённые обещания, призыв к действию', ok:true, e:'Иначе легко получить рекламу с преувеличениями.'},
      {t:'Формат результата или пример', ok:true, e:'Например: «3 варианта по 600 знаков, без эмодзи, ссылка в конце».'},
    ]},
  takeaway:'Роль, контекст, задача, ограничения, формат, примеры. Чем меньше модели приходится угадывать, тем точнее ответ.'},

{ id:'p2', mod:1, title:'Роль, контекст и примеры', short:'Что действительно улучшает ответ', min:10,
  intro:`<p>Популярный совет «начни с „ты лучший в мире эксперт“» работает слабее, чем кажется. Роль задаёт тон и уровень языка, но не даёт модели новых знаний.</p>
  <p>Сильнее всего на качество влияют контекст и примеры. Контекст — это факты о ситуации: аудитория, цель, данные, ограничения бизнеса. Примеры (few-shot) показывают модели, как именно должен выглядеть результат.</p>`,
  cards:[
    {i:'🎭', h:'Роль — для тона', t:'«Ты юрист, объясняешь клиенту без терминов» задаёт стиль. Знания модель берёт из контекста и своей подготовки, а не из роли.'},
    {i:'📚', h:'Контекст — для точности', t:'Вставьте данные, на которые модель должна опираться: выдержку из регламента, цифры, описание клиента. Отметьте, где контекст заканчивается.'},
    {i:'🧪', h:'Примеры — для формата', t:'Два-три образца нужного ответа надёжно задают стиль и структуру. Примеры должны различаться, иначе модель скопирует один.'},
    {i:'⚙️', h:'Постоянные инструкции', t:'То, что повторяется в каждом запросе (кто вы, стиль компании), вынесите в настройки ассистента или инструкции проекта.'},
  ],
  practice:{type:'quiz', intro:'Выберите вариант, который сильнее улучшит результат.', qs:[
    {q:'Модель пишет ответы клиентам слишком официально. Что поможет больше?', o:['Добавить «Ты лучший специалист поддержки в мире»','Показать два примера ответов в нужном тоне'], a:1, e:'Примеры задают тон надёжнее, чем громкая роль.'},
    {q:'Нужно резюме длинного договора для руководителя. Что важнее всего добавить?', o:['Сам текст договора и что именно волнует руководителя','Просьбу «будь внимательным»'], a:0, e:'Без исходного текста и цели модель будет пересказывать то, чего не видела.'},
    {q:'Каждый раз вы пишете: «Мы — сеть кофеен в Казани, тон дружелюбный, без англицизмов». Как удобнее?', o:['Копировать в каждый запрос','Вынести в постоянные инструкции ассистента или проекта'], a:1, e:'Постоянный контекст лучше задать один раз в настройках.'},
  ]},
  takeaway:'Роль задаёт тон, контекст даёт точность, примеры задают формат. Повторяющееся — в постоянные инструкции.'},

{ id:'p3', mod:1, title:'Цепочка рассуждений (Chain of Thought)', short:'Когда просить модель думать по шагам', min:12,
  intro:`<p>В задачах с логикой, расчётами и выбором модель ошибается чаще, если сразу выдаёт вывод. Если попросить её сначала выписать данные и рассуждать по шагам, точность заметно растёт. Этот приём называют цепочкой рассуждений, Chain of Thought.</p>
  <p>Современные «рассуждающие» модели делают это сами. Тогда ваша задача — дать критерии и попросить показать ход решения, чтобы вы могли его проверить. Для простых задач вроде «перепиши короче» цепочка не нужна: она только удлиняет ответ.</p>`,
  cards:[
    {i:'🪜', h:'Сначала данные, потом вывод', t:'«Сначала выпиши исходные данные по каждому варианту, затем сравни по критериям, вывод дай в конце».'},
    {i:'📏', h:'Критерии заранее', t:'Назовите критерии и их вес. Иначе модель выберет свои, и вы их не увидите.'},
    {i:'🧾', h:'Рассуждение отдельно от ответа', t:'Попросите разделы «Рассуждение» и «Итог». Итог удобно использовать, рассуждение — проверять.'},
    {i:'🔁', h:'Самопроверка', t:'Последним шагом попросите проверить расчёты и найти противоречия в собственном ответе.'},
  ],
  practice:{type:'order', label:'Ваша цепочка', intro:'Задача: выбрать одного из трёх поставщиков. Соберите промпт с цепочкой рассуждений. Нажимайте на шаги в нужном порядке.',
    items:['Описать задачу и критерии выбора с весами','Попросить выписать данные по каждому поставщику','Сравнить варианты по каждому критерию по шагам','Проверить расчёты и найти противоречия','Дать итоговую рекомендацию отдельным блоком'],
    e:'Сначала рамка и критерии, затем данные, сравнение, самопроверка и только потом вывод. Так каждый шаг можно проверить.'},
  takeaway:'Для логики и расчётов: критерии → данные → рассуждение по шагам → самопроверка → итог отдельно.'},

// ---- Модуль 2. Декомпозиция задач
{ id:'d1', mod:2, title:'Декомпозиция: от цели к подзадачам', short:'Разбиваем сложную задачу на шаги', min:12,
  intro:`<p>«Подготовь стратегию выхода на новый рынок» — слишком большая задача для одного промпта. Модель выдаст гладкий, но поверхностный текст, потому что ей пришлось решить сразу десять вопросов.</p>
  <p>Декомпозиция — это разбиение цели на подзадачи, у каждой из которых понятный вход и выход. Подзадачи не должны пересекаться и вместе должны покрывать всю цель. Тогда каждую можно поручить ИИ отдельно и проверить.</p>`,
  cards:[
    {i:'🎯', h:'Начните с результата', t:'Опишите, как выглядит готовый результат и кто его будет читать. От этого зависят все шаги.'},
    {i:'🧩', h:'Вход и выход шага', t:'Для каждой подзадачи: что она получает (данные, текст) и что отдаёт дальше (таблица, список, вывод).'},
    {i:'🔗', h:'Порядок и зависимости', t:'Что нельзя начать, пока не готово другое. Анализ без чистых данных и выводы без анализа не работают.'},
    {i:'✅', h:'Контрольные точки', t:'После ключевых шагов — ваша проверка. Ошибку дешевле поймать на втором шаге, чем в готовом отчёте.'},
  ],

{ id:'d2', mod:2, title:'Цепочки промптов и делегирование', short:'Что отдать ИИ, а что оставить себе', min:12,
  intro:`<p>Когда задача разбита на шаги, её можно выполнять цепочкой промптов: результат одного шага становится входом для следующего. Каждый промпт короткий и сфокусированный, поэтому модель справляется лучше.</p>
  <p>Второй вопрос — кто выполняет шаг. Одно можно полностью отдать ИИ, другое — только с вашей проверкой, а третье остаётся за человеком: решения, за которые вы отвечаете.</p>`,
  cards:[
    {i:'🔗', h:'Цепочка промптов', t:'Шаг 1: «извлеки факты». Шаг 2: «сгруппируй их». Шаг 3: «напиши выводы по группам». Каждый результат вы видите и можете поправить.'},
    {i:'🤖', h:'ИИ сам', t:'Рутина, которую легко проверить и не страшно переделать: переформулировки, черновики, варианты.'},
    {i:'👀', h:'ИИ + проверка', t:'Всё, что уйдёт наружу или повлияет на деньги: письма клиентам, цифры в отчётах, юридические формулировки.'},

    {t:'Подготовить черновик ответа на жалобу клиента', k:1, e:'Текст уходит клиенту: тон и обещания нужно проверить.'},

// ---- Модуль 3. Продвинутые техники
{ id:'a1', mod:3, title:'Артефакты: просите результат, а не ответ', short:'Документы, таблицы и страницы', min:10,
  intro:`<p>Многие используют ИИ как собеседника: задают вопрос и получают абзац текста. Но современные ассистенты умеют создавать готовые объекты: документ, таблицу, презентацию, схему, страницу. Их называют артефактами.</p>
  <p>Артефакт удобно дорабатывать: вы не переписываете ответ заново, а просите точечные правки. Так результат становится рабочим файлом, а не перепиской.</p>`,
  cards:[
    {i:'📄', h:'Назовите тип результата', t:'«Сделай таблицу», «собери документ с разделами», «нарисуй схему процесса». Тип результата меняет весь ответ.'},
    {i:'🏗️', h:'Задайте структуру', t:'Перечислите разделы или столбцы. Модель заполнит каркас, вместо того чтобы придумывать его.'},
    {i:'✏️', h:'Правьте точечно', t:'«В разделе 2 замени пример на розничный, остальное не трогай». Так не теряется то, что уже получилось.'},
    {i:'📦', h:'Сохраняйте версии', t:'Перед крупной правкой сохраните удачную версию. К ней можно вернуться, если правка ухудшила результат.'},
  ],
  practice:{type:'quiz', intro:'Выберите более эффективный подход.', qs:[
    {q:'Нужен план запуска продукта, который вы будете дорабатывать неделю.', o:['Попросить ответ в чате и копировать куски','Попросить документ с разделами и дорабатывать его правками'], a:1, e:'Документ живёт и улучшается, а куски ответов теряются в переписке.'},
    {q:'Таблица почти готова, но в одном столбце ошибка.', o:['«Переделай таблицу»','«В столбце „Маржа“ пересчитай значения по формуле (цена − себестоимость) / цена, остальное не меняй»'], a:1, e:'Точечная правка сохраняет всё, что уже верно.'},
    {q:'Нужна схема согласования договора.', o:['Попросить описать процесс абзацем','Попросить схему процесса с ролями и шагами'], a:1, e:'Процесс с ветвлениями понятнее на схеме, чем в тексте.'},
  ]},
  takeaway:'Просите артефакт с заданной структурой и дорабатывайте его точечными правками.'},

{ id:'a2', mod:3, title:'Генерация кода без программиста', short:'Скрипты, формулы и автоматизация', min:12,
  intro:`<p>ИИ пишет рабочий код: формулы для таблиц, скрипты для обработки файлов, небольшие автоматизации. Программистом для этого быть не нужно, но нужно уметь описать задачу и безопасно проверить результат.</p>
  <p>Хорошее техническое задание для кода — это пример входных данных, пример нужного результата и описание особых случаев: пустые ячейки, разные форматы дат, повторы.</p>`,
  cards:[

    {i:'🧪', h:'Тесты', t:'Попросите проверить код на трёх примерах, включая неудобный: пустое значение, ошибка в данных.'},
    {i:'🗣️', h:'Объяснение', t:'Попросите объяснить, что делает каждая часть. Если объяснение непонятно, попросите проще. Так вы заметите лишнее.'},
    {i:'🛡️', h:'Безопасность', t:'Запускайте на копии данных. Не вставляйте в чат пароли и ключи доступа, а код не запускайте с лишними правами.'},

    {t:'Попросить объяснить каждую строку кода', k:'a', e:'Так проще заметить лишние или опасные действия.'},

    {t:'Попросить тесты на трёх примерах, включая пустые значения', k:'a', e:'Особые случаи — самый частый источник ошибок.'},

{ id:'a3', mod:3, title:'Анализ больших массивов данных', short:'Таблицы на тысячи строк', min:12,
  intro:`<p>Языковая модель плохо считает «в уме» и может прочитать большой файл не целиком. Если попросить её посмотреть на 20 000 строк и сказать среднее, она может уверенно назвать неверное число.</p>
  <p>Надёжный путь — попросить модель написать код или формулы и выполнить их. Тогда расчёт делает программа, а модель отвечает за план анализа и выводы. Многие ассистенты умеют сами запускать такой код.</p>`,
  cards:[
    {i:'🗂️', h:'Опишите данные', t:'Что значит каждый столбец, в каких единицах, за какой период. Модель не должна угадывать смысл «col_7».'},
    {i:'🧹', h:'Сначала проверка данных', t:'Пропуски, дубли, разные форматы, выбросы. Выводы на грязных данных ничего не стоят.'},
    {i:'🧮', h:'Считает код', t:'Просите расчёт кодом или формулами, а не «посмотри и скажи». Код можно перезапустить и проверить.'},
    {i:'🔎', h:'Выборочная сверка', t:'Проверьте пару итоговых цифр вручную или фильтром в таблице. Если они сошлись, доверие к остальному выше.'},

  practice:{type:'order', label:'Ваш порядок анализа', intro:'У вас выгрузка продаж за год, 20 000 строк. Расставьте шаги анализа с ИИ по порядку.',
    items:['Описать задачу и значение каждого столбца','Проверить данные: пропуски, дубли, форматы дат','Посчитать показатели кодом или формулами','Сверить пару итоговых цифр вручную','Построить графики и сформулировать выводы'],
    e:'Смысл данных → качество данных → расчёт программой → сверка → выводы. Выводы всегда последние.'},

{ id:'a4', mod:3, title:'Свой GPT и ИИ-агенты', short:'Ассистенты под ваши задачи', min:12,
  intro:`<p>Собственный ассистент (кастомный GPT, проект с инструкциями) — это сохранённые инструкции, файлы знаний и инструменты под одну задачу. Вы один раз настраиваете его, а дальше просто ставите задачи.</p>
  <p>ИИ-агент идёт дальше: он получает цель и сам выполняет её по шагам — ищет, читает, считает, составляет результат. Чем больше самостоятельности, тем важнее границы и журнал действий, по которому видно, что агент делал.</p>`,

// ---- Модуль 4. Ошибки и ограничения
{ id:'e1', mod:4, title:'Галлюцинации и как их снижать', short:'Почему модель уверенно ошибается', min:12,
  intro:`<p>Модель не ищет ответ в базе фактов, а предсказывает правдоподобный текст. Поэтому иногда она уверенно называет несуществующие цифры, ссылки и цитаты. Это называют галлюцинациями.</p>
  <p>Полностью их не убрать, но можно сильно снизить: дать модели источники, попросить опираться только на них, разрешить ответ «не знаю» и требовать цитаты. А то, что уходит наружу, всё равно проверять.</p>`,
  cards:[
    {i:'📎', h:'Дайте источник', t:'Вставьте документ или данные и напишите: «отвечай только по этому тексту».'},
    {i:'🤷', h:'Разрешите «не знаю»', t:'«Если в тексте нет ответа, так и напиши». Без этого модель часто додумывает.'},
    {i:'🔖', h:'Требуйте цитаты', t:'Попросите указывать фрагмент источника для каждого важного утверждения. Цитату легко проверить.'},

{ id:'e2', mod:4, title:'Проверяем логику модели', short:'Приёмы, которые действительно работают', min:10,
  intro:`<p>Вопрос «ты уверен?» почти ничего не проверяет: модель либо повторит ответ, либо поменяет его, просто чтобы угодить. Нужны приёмы, которые проверяют рассуждение, а не уверенность.</p>
  <p>Хорошие проверки делают ошибку видимой: допущения выписаны, числа пересчитаны программой, факты сверены с первоисточником, а вывод получен независимо второй раз.</p>`,
  cards:[
    {i:'🧱', h:'Выпишите допущения', t:'«Перечисли, какие допущения ты сделал». Ошибка часто прячется в допущении, а не в выводе.'},

    {i:'🆕', h:'Независимый второй ответ', t:'Задайте тот же вопрос в новом чате или другой модели, не показывая первый ответ. Расхождение — сигнал.'},
    {i:'🔄', h:'Контрпример', t:'«Приведи случай, когда этот вывод неверен». Если такой случай легко найти, вывод слишком общий.'},
  ],
  practice:{type:'multi', intro:'Какие приёмы действительно проверяют вывод модели? Отметьте все подходящие.',

      {t:'Задать тот же вопрос в новом чате без подсказок', ok:true, e:'Независимый ответ показывает, устойчив ли вывод.'},

    ]},
  takeaway:'Проверяйте рассуждение, а не уверенность: допущения, пересчёт, независимый ответ, первоисточник.'},

// Весь прогресс лежит в одном ключе с номером версии схемы. Ключи aic-* остались

const STORE_KEY='mentora:v2', SCHEMA=2;
const LEGACY_KEYS=['aic-done','aic-agents','aic-seen','aic-big','aic-project'];
function LS(k,v){
  try{
    if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null');
    if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v));
  }catch(e){ return null; } // приватный режим или повреждённые данные: работаем без сохранения
}
const LESSON_IDS=new Set(LESSONS.map(l=>l.id));

// Неизвестные id (удалённые уроки, мусор) отбрасываются.
function cleanDone(list){
  const got=new Set(Array.isArray(list)?list.filter(x=>typeof x==='string'&&LESSON_IDS.has(x)):[]);
  const out=[]; for(const l of LESSONS){ if(!got.has(l.id)) break; out.push(l.id); } return out;
}
const defaultState=()=>({v:SCHEMA,done:[],seen:false,big:false});
function loadState(){
  LEGACY_KEYS.forEach(k=>LS(k,null));

  if(!raw||typeof raw!=='object'||raw.v!==SCHEMA){ const st=defaultState(); LS(STORE_KEY,st); return st; } // первый вход: уровень 0
  return {v:SCHEMA,done:cleanDone(raw.done),seen:raw.seen===true,big:raw.big===true};
}

// SHA-256 без внешних зависимостей: коды хранятся только в виде хешей.
const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(text){
  const bytes=new TextEncoder().encode(text), len=bytes.length, total=((len+9+63)>>6)<<6;
  const m=new Uint8Array(total); m.set(bytes); m[len]=0x80;
  const dv=new DataView(m.buffer), bits=len*8;
  dv.setUint32(total-8,Math.floor(bits/4294967296)); dv.setUint32(total-4,bits>>>0);
  const h=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w=new Uint32Array(64), rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<total;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const a=w[i-15], b=w[i-2]; w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))>>>0; }
    let [A,B,C,D,E,F,G,H]=h;
    for(let i=0;i<64;i++){
      const t1=(H+(rr(E,6)^rr(E,11)^rr(E,25))+((E&F)^(~E&G))+SHA_K[i]+w[i])>>>0;
      const t2=((rr(A,2)^rr(A,13)^rr(A,22))+((A&B)^(A&C)^(B&C)))>>>0;
      H=G; G=F; F=E; E=(D+t1)>>>0; D=C; C=B; B=A; A=(t1+t2)>>>0;
    }
    h[0]+=A; h[1]+=B; h[2]+=C; h[3]+=D; h[4]+=E; h[5]+=F; h[6]+=G; h[7]+=H;
  }
  return [...h].map(x=>x.toString(16).padStart(8,'0')).join('');
}
// Хеш от 'mentora-promo:' + код. dur — длительность доступа в мс, null — бессрочно.
const PROMO_CODES={

  'e40e7fc455e48a01d26208f37ba8f6c26790fbe9fdc5eb44a76ecfcf66bae926':{dur:7*864e5},

const PROMO_RE=/^[A-Z0-9]+(?:-[A-Z0-9]+)+$/, PROMO_MIN=8, PROMO_MAX=64;
const MAX_FAILS=5, FAIL_WINDOW=10*60e3;
const LOOKALIKE={'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X','У':'Y'};
let expiredNotice=false;

function readAccess(){
  const a=LS(ACCESS_KEY);
  if(a===null) return null;
  const valid=a&&typeof a==='object'&&a.plan==='premium'&&typeof a.source==='string'&&(a.until===null||Number.isFinite(a.until));
  if(!valid){ LS(ACCESS_KEY,null); return null; }
  if(a.until!==null&&a.until<=Date.now()){ LS(ACCESS_KEY,null); expiredNotice=true; return null; }
  return a;
}
const hasPremium=()=>!!readAccess();
function grantAccess(source,dur){
  const now=Date.now(), cur=readAccess();
  let until=dur===null?null:now+dur;
  if(cur&&until!==null) until=cur.until===null?null:Math.max(until,cur.until); // доступ только продлевается, никогда не сокращается
  LS(ACCESS_KEY,{plan:'premium',source,until,activatedAt:now});
}
function revokeAccess(){ LS(ACCESS_KEY,null); }
const fmtDate=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const plural=(n,a,b,c)=>{ const m=n%10, h=n%100; return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c; };

function normalizePromo(raw){
  return String(raw??'').normalize('NFKC').toUpperCase()
    .replace(/[‐-―−﹘﹣－]/g,'-') // длинные тире и похожие символы
    .replace(/\s+/g,'')
    .replace(/[АВЕКМНОРСТХУ]/g,c=>LOOKALIKE[c]);            // русские буквы, похожие на латинские
}
function promoFormatError(code){
  if(!code) return 'Введите промокод.';
  if(/[А-ЯЁ]/.test(code)) return 'В коде есть русские буквы. Переключите раскладку на английскую.';
  if(code.length<PROMO_MIN||code.length>PROMO_MAX) return `Промокод должен быть длиной от ${PROMO_MIN} до ${PROMO_MAX} символов.`;
  if(!PROMO_RE.test(code)) return 'Промокод состоит из латинских букв и цифр, разделённых одиночными дефисами, например ABCD-1234-EFGH.';
  return '';
}
function promoLog(){
  const d=LS(PROMO_KEY), now=Date.now();
  return {
    redeemed:Array.isArray(d&&d.redeemed)?d.redeemed.filter(x=>typeof x==='string'&&/^[0-9a-f]{64}$/.test(x)):[],
    fails:Array.isArray(d&&d.fails)?d.fails.filter(t=>Number.isFinite(t)&&t>now-FAIL_WINDOW&&t<=now+60e3).sort((a,b)=>a-b):[],
  };
}
const lockLeft=log=>log.fails.length>=MAX_FAILS?Math.max(0,log.fails[log.fails.length-MAX_FAILS]+FAIL_WINDOW-Date.now()):0;
function redeemPromo(raw){
  const log=promoLog(), wait=lockLeft(log);
  if(wait>0){ const m=Math.ceil(wait/60e3); return {ok:false,msg:`Слишком много неверных попыток. Попробуйте снова через ${m} ${plural(m,'минуту','минуты','минут')}.`}; }
  const code=normalizePromo(raw), err=promoFormatError(code);
  if(err) return {ok:false,msg:err}; // опечатки в формате не считаются попытками
  const hash=sha256('mentora-promo:'+code), def=PROMO_CODES[hash];
  if(!def){
    log.fails.push(Date.now()); LS(PROMO_KEY,log);
    const left=MAX_FAILS-log.fails.length;
    return {ok:false,msg:'Такого промокода нет. Проверьте, нет ли опечатки.'+(left>0?` Осталось попыток: ${left}.`:' Ввод временно заблокирован на 10 минут.')};
  }
  const cur=readAccess();
  if(cur&&cur.until===null) return {ok:false,msg:'Полный доступ уже открыт бессрочно, промокод не нужен.'};
  if(def.dur!==null&&log.redeemed.includes(hash)) return {ok:false,msg:'Этот промокод уже активирован на этом устройстве.'};
  grantAccess('promo',def.dur);
  if(!log.redeemed.includes(hash)) log.redeemed.push(hash);
  log.fails=[]; LS(PROMO_KEY,log);
  const a=readAccess();
  return {ok:true,msg:a.until===null?'Промокод принят: полный доступ открыт бессрочно.':`Промокод принят: полный доступ открыт до ${fmtDate(a.until)}.`};
}

  const cL=()=>{ if(inL){ h+='</ul>'; inL=false; } };
  for(const raw of lines){ const l=raw.trimEnd();
    if(/^\s*\|/.test(l)){ cL(); tbl.push(l); continue; } else fT();
    if(/^#{1,4}\s/.test(l)){ cL(); h+='<h4>'+il(l.replace(/^#+\s/,''))+'</h4>'; continue; }

}

  if(qaMode()&&!$('#qaBadge')) $('#mini').insertAdjacentHTML('beforebegin','<button class="qa-badge" id="qaBadge" data-go="access" title="Режим тестировщика">QA</button>'); if(!qaMode()) $('#qaBadge')?.remove(); $('#mini').innerHTML=`<span class="track"><i style="width:${n/TOTAL*100}%"></i></span><span title="Уровень: число пройденных модулей из ${MODULES.length}. Пройдено уроков: ${n} из ${TOTAL}">Ур. ${userLevel()}<span class="cnt"> · ${n}/${TOTAL}</span></span>`; }
function render(){
  renderMini(); const r=route();
  if(expiredNotice){ expiredNotice=false; setTimeout(()=>toast('Срок тестового доступа истёк'),300); }
  if(r.page==='missing'){ // старая или ошибочная ссылка: тихо возвращаем на главную без записи в историю
    history.replaceState(null,'',location.pathname+location.search); L=null; renderHome(); toast('Такой страницы нет, открыта главная'); return; }
  if(r.page==='lesson'){ const st=lessonStatus(r.l); if(st==='done'||st==='open') renderLesson(r.l); else { L=null; renderLocked(r.l,st); } return; }
  L=null; if(PAGES[r.page]) PAGES[r.page](); else renderHome();
}

function freeRange(){ const f=LESSONS.filter(l=>!l.premium); return f.length?`${f[0].n}–${f[f.length-1].n}`:'—'; }
function promoFormHTML(){ return `<form class="promo" novalidate>
    <label class="f" for="promoIn">Промокод</label>
    <div class="promo-row"><input type="text" id="promoIn" name="promo" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="80" placeholder="Например: ABCD-1234-EFGH"><button class="btn" type="submit">Применить</button></div>
    <div class="promo-msg" role="status" aria-live="polite"></div>
  </form>`; }
function bindPromo(root,onOk){
  const f=$('form.promo',root); if(!f) return; const inp=$('#promoIn',f), msg=$('.promo-msg',f);
  let busy=false;
  f.onsubmit=e=>{ e.preventDefault(); if(busy) return; busy=true;
    const r=redeemPromo(inp.value);
    msg.className='promo-msg '+(r.ok?'ok':'no'); msg.textContent=r.msg;
    if(r.ok){ inp.value=''; confetti(); toast('Полный доступ открыт'); renderMini(); setTimeout(()=>{ busy=false; onOk&&onOk(); },900); }
    else { inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); busy=false; }
  };
  inp.oninput=()=>{ msg.textContent=''; msg.className='promo-msg'; };
}
function renderAccess(){
  const a=readAccess(), paid=LESSONS.filter(l=>l.premium), free=LESSONS.filter(l=>!l.premium);
  const status=a?`<span class="pill ok">Полный доступ</span><p>${a.until===null?'Без ограничения по времени':'Действует до '+fmtDate(a.until)}. Источник: ${a.source==='qa'?'тестовая подписка':'промокод'}.</p>`
                 :`<span class="pill mid">Бесплатный доступ</span><p>Открыты уроки ${freeRange()}. Ещё ${paid.length} ${plural(paid.length,'урок','урока','уроков')} входят в полный доступ.</p>`;
  $('#app').innerHTML=`<div class="view"><div class="wrap page">
    <button class="btn plain" data-go="home">← На главную</button>
    <h1>Доступ к урокам</h1>
    <div class="panel acc-status">${status}</div>
    <div class="acc-grid">
      <div class="panel"><h3>Бесплатно</h3><ul>${free.map(l=>`<li>${l.n}. ${l.title}</li>`).join('')}</ul></div>
      <div class="panel"><h3>Полный доступ</h3><ul>${paid.map(l=>`<li>${l.n}. ${l.title}</li>`).join('')}</ul></div>
    </div>
    ${a&&a.until===null?'':`<div class="panel" style="margin-top:14px"><h3>Есть промокод?</h3><p class="hint">Онлайн-оплата пока не подключена. Промокод открывает полный доступ сразу.</p>${promoFormHTML()}</div>`}
    ${qaMode()?qaPanelHTML():''}
  </div></div>`;
  bindPromo($('#app'),()=>renderAccess());
  if(qaMode()) bindQa();
}

function qaPanelHTML(){
  const dump={schema:SCHEMA,done:[...done],access:readAccess(),promo:promoLog(),qa:qaMode()};
  return `<section class="qa-panel"><div class="qa-head"><span class="qa-badge">QA</span><h3>Для тестировщиков</h3></div>
    <p class="hint">Панель видна только в режиме тестировщика. Выключить: кнопка ниже или адрес с <code>?qa=0</code>.</p>
    <div class="qa-btns">
      <button class="btn" id="qaSub">Активировать тестовую подписку</button>
      <button class="btn soft" id="qaRevoke">Отключить подписку</button>
      <button class="btn soft" id="qaAll">Отметить все уроки пройденными</button>
      <button class="btn soft" id="qaFails">Сбросить счётчик неверных промокодов</button>
      <button class="btn soft danger" id="qaReset">Сбросить прогресс</button>
      <button class="btn plain" id="qaOff">Выйти из режима тестировщика</button>
    </div>
    <details class="more"><summary>Состояние приложения</summary><pre class="qa-dump">${esc(JSON.stringify(dump,null,2))}</pre></details>
  </section>`;
}
function bindQa(){
  const after=t=>{ toast(t); renderMini(); renderAccess(); };
  $('#qaSub').onclick=()=>{ grantAccess('qa',null); after('Тестовая подписка активирована'); };
  $('#qaRevoke').onclick=()=>{ revokeAccess(); after('Подписка отключена'); };
  $('#qaAll').onclick=()=>{ done=new Set(LESSONS.map(l=>l.id)); saveState(); saveCloud(); after('Все уроки отмечены пройденными'); };
  $('#qaFails').onclick=()=>{ const g=promoLog(); g.fails=[]; LS(PROMO_KEY,g); after('Счётчик попыток сброшен'); };
  let armed=null; const rb=$('#qaReset');
  rb.onclick=()=>{ if(!armed){ rb.textContent='Нажмите ещё раз, чтобы сбросить'; armed=setTimeout(()=>{ armed=null; rb.textContent='Сбросить прогресс'; },4000); return; }
    clearTimeout(armed); armed=null; resetProgress(); after('Прогресс сброшен до нуля'); };
  $('#qaOff').onclick=()=>{ LS(QA_KEY,null); toast('Режим тестировщика выключен'); renderMini(); renderAccess(); };
}

  drawStage();
}
function drawSteps(){ $('#steps').innerHTML=STAGES.map((s,i)=>{ const can=i<=2||passed; return `<button class="s ${i<stage?'past':''} ${i===stage?'cur':''}" ${can?`data-stage="${i}"`:'disabled'}><i></i>${s}</button>`; }).join(''); $$('#steps [data-stage]').forEach(b=>b.onclick=()=>{ stage=+b.dataset.stage; drawStage(); }); }
function setStage(i){ stage=i; drawStage(); window.scrollTo({top:0,behavior:reduced?'auto':'smooth'}); }
function drawStage(){
  drawSteps(); const l=L, box=$('#stage');
  if(stage===0){ box.innerHTML=`<div class="stage"><h2>${l.title}</h2><div class="story">${l.intro}</div><div class="navrow"><span class="spacer"></span><button class="btn" id="nx">К теории <span class="arr">→</span></button></div></div>`; $('#nx').onclick=()=>setStage(1); }
  if(stage===1){ box.innerHTML=`<div class="stage"><h2>Коротко о главном</h2><p class="hint" style="margin:-6px 0 14px">Незнакомый термин? Загляните в <button class="wordlink" data-go="glossary">словарик</button>.</p><div class="cards">${l.cards.map(c=>`<div class="tcard reveal" style="--c:${l.c}"><div class="ti">${c.i}</div><div><h3>${c.h}</h3><p>${c.t}</p></div></div>`).join('')}</div><div class="navrow"><button class="btn plain" id="bk">← Назад</button><span class="spacer"></span><button class="btn" id="nx">К практике <span class="arr">→</span></button></div></div>`; observeReveal(); $('#bk').onclick=()=>setStage(0); $('#nx').onclick=()=>setStage(2); }
  if(stage===2){ box.innerHTML=`<div class="stage"><h2>Практика</h2><div class="panel" id="prac"></div><div id="succ"></div><div class="navrow"><button class="btn plain" id="bk">← К теории</button></div></div>`; $('#bk').onclick=()=>setStage(1); PRACTICE[l.practice.type]($('#prac'),l.practice,onPass); if(passed) showSuccess(true); }
  if(stage===3){ const nl=LESSONS[l.n]; const all=doneCount()>=TOTAL; box.innerHTML=`<div class="stage"><div class="takeaway"><div class="big">${all?'🎓':'🌱'}</div><h2>${all?'Курс пройден!':'Урок пройден'}</h2><p class="tk">${l.takeaway}</p>${all?'<p class="hint">Вы прошли все уроки курса.</p>':''}<div class="navrow" style="justify-content:center">${nl?(lessonStatus(nl)==='premium'?`<button class="btn" data-go="access">Урок ${nl.n} — в полном доступе <span class="arr">→</span></button>`:`<button class="btn" data-go="${nl.id}">Урок ${nl.n}: ${nl.title} <span class="arr">→</span></button>`):''}<button class="btn soft" data-go="home">На главную</button></div></div></div>`; if(all) confetti(); }
}
function onPass(){ if(!passed){ passed=true; markDone(L.id); confetti(); } showSuccess(false); drawSteps(); }
function showSuccess(quiet){ const s=$('#succ'); if(!s) return; s.innerHTML=`<div class="success ${quiet?'':'pop'}">${CHECK}<div class="st">Отлично, задание выполнено!<small>Осталось прочитать короткий итог урока.</small></div><button class="btn" id="toEnd">Итог <span class="arr">→</span></button></div>`; $('#toEnd').onclick=()=>setStage(3); }

// =============== ПРАКТИКИ ===============
const PRACTICE={
quiz(el,p,pass){
  const ok=new Set();
  el.innerHTML=`<div class="task-intro">${p.intro}</div>`+p.qs.map((x,i)=>`<div class="q" data-q="${i}"><div class="qt">${i+1}. ${x.q}</div>${x.o.map((o,j)=>`<button class="opt" data-i="${i}" data-j="${j}">${o}</button>`).join('')}<div class="ex"></div></div>`).join('');
  $$('.opt',el).forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, j=+b.dataset.j, x=p.qs[i], ex=$(`[data-q="${i}"] .ex`,el);
    if(j===x.a){ $$(`.opt[data-i="${i}"]`,el).forEach(o=>{ o.classList.add('locked'); o.classList.remove('wrong'); }); b.classList.add('right'); ex.innerHTML=`<div class="expl ok">Верно. ${x.e}</div>`; ok.add(i); if(ok.size===p.qs.length) pass(); }
    else{ b.classList.add('wrong','shake'); setTimeout(()=>b.classList.remove('shake'),400); ex.innerHTML=`<div class="expl no">Не совсем. Подумайте ещё и выберите другой вариант.</div>`; }
  });
},
order(el,p,pass){
  const correct=p.items; let pool=shuffle(correct); while(pool.join()===correct.join()) pool=shuffle(correct); let seq=[];
  const draw=()=>{ el.innerHTML=`<div class="task-intro">${p.intro}</div>
    <div class="colhead">${p.label||'Порядок агента'}</div><div class="seq">${seq.length?seq.map((t,i)=>`<button class="chip" data-back="${i}"><span class="cn">${i+1}</span>${esc(t)}</button>`).join(''):'<p class="hint">Нажмите на первый шаг ниже.</p>'}</div>
    <div class="colhead">Шаги</div><div class="pool">${pool.map((t,i)=>`<button class="chip" data-pick="${i}"><span class="cn">·</span>${esc(t)}</button>`).join('')||'<p class="hint">Все шаги расставлены.</p>'}</div>
    <div class="navrow"><button class="btn" id="chkO" ${seq.length<correct.length?'disabled':''}>Проверить</button><button class="btn plain" id="rstO">Сбросить</button></div><div id="resO"></div>`;
    $$('[data-pick]',el).forEach(b=>b.onclick=()=>{ seq.push(pool.splice(+b.dataset.pick,1)[0]); draw(); });
    $$('[data-back]',el).forEach(b=>b.onclick=()=>{ pool.push(seq.splice(+b.dataset.back,1)[0]); draw(); });
    $('#rstO',el).onclick=()=>{ pool=shuffle(correct); seq=[]; draw(); };
    $('#chkO',el).onclick=()=>{ let good=0; $$('.seq .chip',el).forEach((c,i)=>{ const r=seq[i]===correct[i]; c.classList.add(r?'right':'wrong'); if(r) good++; });
      if(good===correct.length){ $('#resO',el).innerHTML=`<div class="expl ok">Всё верно! ${p.e}</div>`; $$('.chip',el).forEach(c=>c.disabled=true); pass(); }
      else $('#resO',el).innerHTML=`<div class="tryagain">На своих местах ${good} из ${correct.length}. Нажмите на шаг, чтобы вернуть его, и попробуйте ещё раз.</div>`; };
  }; draw();
},
sort(el,p,pass){
  const opts=p.opts||[p.a,p.b]; const keyOf=it=>typeof it.k==='number'?it.k:(it.k==='a'?0:1); const ok=new Set();
  el.innerHTML=`<div class="task-intro">${p.intro}</div>`+p.items.map((it,i)=>`<div class="sortitem" data-it="${i}"><div class="st">${esc(it.t)}</div><div class="bs">${opts.map((o,j)=>`<button data-i="${i}" data-j="${j}">${o}</button>`).join('')}</div><div class="ex"></div></div>`).join('');
  $$('.bs button',el).forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, j=+b.dataset.j, it=p.items[i], box=$(`[data-it="${i}"]`,el);
    $$('button',box).forEach(x=>x.classList.remove('chosen')); b.classList.add('chosen');
    if(j===keyOf(it)){ box.className='sortitem okk'; $('.ex',box).innerHTML=`<div class="expl ok">${it.e}</div>`; $$('button',box).forEach(x=>x.disabled=true); ok.add(i); if(ok.size===p.items.length) pass(); }
    else{ box.className='sortitem nok'; box.classList.add('shake'); setTimeout(()=>box.classList.remove('shake'),400); $('.ex',box).innerHTML=`<div class="expl no">Попробуйте другой вариант.</div>`; }
  });
},
log(el,p,pass){
  const S=p.steps;
  el.innerHTML=`<div class="task-intro">${p.intro}</div>
    <button class="btn" id="runL">▶ Запустить агента</button><div class="log" id="logL" style="margin-top:16px"></div><div id="qL"></div>`;
  $('#runL',el).onclick=()=>{ $('#runL',el).disabled=true; const box=$('#logL',el); let i=0;
    const tick=()=>{ if(!box.isConnected) return; if(i<S.length){ box.insertAdjacentHTML('beforeend','<div class="typing" id="tp"><i></i><i></i><i></i></div>'); setTimeout(()=>{ $('#tp',el)?.remove(); if(!box.isConnected) return; box.insertAdjacentHTML('beforeend',stepHTML(S[i],i)); i++; tick(); },reduced?0:500); } else ask(); }; tick(); };
  function ask(){ $('#qL',el).innerHTML=`<div class="task-intro" style="margin-top:18px">${p.ask}</div><div id="rL"></div>`;
    $$('#logL .step',el).forEach(b=>{ b.classList.add('pick'); b.onclick=()=>{ const i=+b.dataset.step; $$('#logL .step',el).forEach(x=>x.classList.remove('right','wrong'));
      if(i===p.bad){ b.classList.add('right'); $('#rL',el).innerHTML=`<div class="expl ok">${p.ok}</div>`; $$('#logL .step',el).forEach(x=>x.onclick=null); pass(); }
      else{ b.classList.add('wrong','shake'); $('#rL',el).innerHTML=`<div class="expl no">${p.no}</div>`; } }; }); }
},
finderr(el,p,pass){
  const D=p.sents, need=D.filter(x=>x.e).length, sel=new Set();
  el.innerHTML=`<div class="task-intro">${p.intro}</div>
   <div class="doc">${D.map((x,i)=>`<span class="sent" data-s="${i}" role="button" tabindex="0">${esc(x.t)}</span> `).join('')}</div>
   <div class="navrow"><button class="btn" id="chkF">Проверить</button><span class="hint" id="cntF">Отмечено: 0</span></div><div id="rF"></div>`;
  const toggle=x=>{ const i=+x.dataset.s; sel.has(i)?sel.delete(i):sel.add(i); x.className='sent'+(sel.has(i)?' sel':''); $('#cntF',el).textContent='Отмечено: '+sel.size; };
  $$('.sent',el).forEach(x=>{ x.onclick=()=>toggle(x); x.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(x); } }; });
  $('#chkF',el).onclick=()=>{ let hit=0,extra=0; const notes=[];
    D.forEach((x,i)=>{ const n=$(`[data-s="${i}"]`,el); if(x.e&&sel.has(i)){ hit++; n.className='sent right'; notes.push(x.e); } else if(!x.e&&sel.has(i)){ extra++; n.className='sent wrong'; } else if(x.e) n.className='sent missed'; else n.className='sent'; });
    if(hit===need&&!extra){ $('#rF',el).innerHTML=`<div class="expl ok">Все ошибки найдены!<br>• ${notes.join('<br>• ')}</div>`; $$('.sent',el).forEach(x=>{ x.onclick=null; x.onkeydown=null; }); pass(); }
    else $('#rF',el).innerHTML=`<div class="tryagain">Найдено ${hit} из ${need}${extra?`, и ещё ${extra} отмечено зря`:''}. Пропущенные ошибки подчёркнуты красным. Поправьте отметки и проверьте снова.</div>`; };
},
privacy(el,p,pass){
  const PII=p.pii.map(x=>({re:new RegExp(x.re,'i'),l:x.l})), SENSE=p.sense.map(x=>new RegExp(x,'i'));
  el.innerHTML=`<div class="task-intro">${p.intro}</div>
    <textarea id="dP" rows="6" aria-label="Текст запроса"></textarea><div class="navrow"><button class="btn" id="chkP">Проверить запрос</button><button class="btn plain" id="rstP">Вернуть исходный текст</button></div><div id="rP"></div>`;
  const ta=$('#dP',el); ta.value=p.draft; $('#rstP',el).onclick=()=>{ ta.value=p.draft; $('#rP',el).innerHTML=''; };
  $('#chkP',el).onclick=()=>{ const v=ta.value, left=PII.filter(x=>x.re.test(v));
    if(left.length){ $('#rP',el).innerHTML=`<div class="tryagain">Почти! Ещё осталось: ${left.map(x=>x.l).join(', ')}.</div>`; return; }
    if(!SENSE.every(r=>r.test(v))){ $('#rP',el).innerHTML=`<div class="tryagain">Чувствительных данных больше нет, но потерялся смысл. ${p.senseMsg}</div>`; return; }
    $('#rP',el).innerHTML='<div class="expl ok">Запрос безопасный, а задача по-прежнему понятна. Вот какой ответ можно получить по такому запросу.</div><div class="out">'+md(p.sample)+'</div><p class="hint" style="margin-top:8px">Настоящие данные вы подставите сами, уже в готовый текст.</p>'; pass(); };
},
multi(el,p,pass){
  const sel=new Set(), need=new Set(p.opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0));
  el.innerHTML=`<div class="task-intro">${p.intro}</div>${p.doc?`<div class="doc" style="line-height:1.7;margin-bottom:14px">${esc(p.doc)}</div>`:''}
    <div class="mlist">${p.opts.map((o,i)=>`<button class="mopt" data-m="${i}" aria-pressed="false"><span class="box"></span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="navrow"><button class="btn" id="chkM">Проверить</button><span class="hint" id="cntM">Выбрано: 0</span></div><div id="rM"></div>`;
  $$('.mopt',el).forEach(b=>b.onclick=()=>{ const i=+b.dataset.m; sel.has(i)?sel.delete(i):sel.add(i); b.classList.toggle('on',sel.has(i)); b.classList.remove('right','wrong','missed'); b.setAttribute('aria-pressed',sel.has(i)); $('#cntM',el).textContent='Выбрано: '+sel.size; });
  $('#chkM',el).onclick=()=>{ let hit=0, extra=0;
    $$('.mopt',el).forEach(b=>{ const i=+b.dataset.m; b.classList.remove('right','wrong','missed'); if(sel.has(i)&&need.has(i)){ hit++; b.classList.add('right'); } else if(sel.has(i)){ extra++; b.classList.add('wrong'); } else if(need.has(i)) b.classList.add('missed'); });
    if(hit===need.size&&!extra){ $('#rM',el).innerHTML=`<div class="expl ok">Всё верно!<br>${p.opts.map(o=>`• <b>${esc(o.t)}</b> — ${o.e}`).join('<br>')}</div>`; $$('.mopt',el).forEach(b=>{ b.disabled=true; }); $('#chkM',el).disabled=true; pass(); }
    else $('#rM',el).innerHTML=`<div class="tryagain">Верно выбрано ${hit} из ${need.size}${extra?`, лишних — ${extra}`:''}. Лишние варианты отмечены красным, пропущенные — пунктиром. Поправьте и проверьте снова.</div>`; };
},
};
function stepHTML(s,i){ const ic={think:'💭',tool:'🔧',warn:'⚠️',done:'✓'}[s.k]; return `<button class="step ${s.k}" data-step="${i}"><span class="ic">${ic}</span><span><span class="sa">${esc(s.a)}</span><br><span class="sw">${esc(s.w)}</span></span></button>`; }

// =============== СТАРТ ===============
render(); initCloud();
</script>
</body>
